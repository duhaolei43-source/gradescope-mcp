name: Synthetic tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: brew install poppler
      - run: npm ci
      - run: npm run smoke
      - run: python3 scripts/test_package.py
      - run: npm run package:skill
      - uses: actions/upload-artifact@v4
        with:
          name: gradescope-study-companion-node-${{ matrix.node }}
          path: |
            dist/gradescope-study-companion.zip
            dist/gradescope-study-companion.zip.sha256
